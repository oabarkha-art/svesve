name: Portfolio prüfen
on:
  push:
    branches: [website-layout-updates-2026-10]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: svee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: svee/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
